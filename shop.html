<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mağaza | Birol Kaynarpınar</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.4.1/default/snipcart.css" />

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 40px 20px;
        }
        .container { max-width: 720px; margin: 0 auto; }
        header { margin-bottom: 32px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        a.back-link { color: var(--accent-color); text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 24px; }
        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
        .product-price { font-family: 'JetBrains Mono', monospace; color: var(--accent-color); font-size: 1.1rem; margin-bottom: 16px; }
        .buy-btn {
            background-color: var(--accent-color);
            color: #0d1117;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .buy-btn:hover { background-color: var(--accent-hover); }
        .cart-summary {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <a href="index.html" class="back-link">← Ana Sayfa</a>
                <h1 style="font-size: 1.5rem; margin-top: 8px;">Mağaza</h1>
            </div>
            <button class="snipcart-checkout cart-summary">
                Sepet (<span class="snipcart-items-count">0</span>)
            </button>
        </header>

        <main>
            <div class="product-grid">
                <div class="product-card">
                    <div>
                        <div class="product-title">Örnek Ürün / E-Kitap</div>
                        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 12px;">Dijital indirme veya fiziksel ürün açıklaması.</p>
                        <div class="product-price">₺150.00</div>
                    </div>
                    <button class="buy-btn snipcart-add-item"
                        data-item-id="urun-1"
                        data-item-price="150.00"
                        data-item-url="/shop.html"
                        data-item-description="Dijital indirme veya fiziksel ürün açıklaması."
                        data-item-name="Örnek Ürün / E-Kitap">
                        Sepete Ekle
                    </button>
                </div>

                <div class="product-card">
                    <div>
                        <div class="product-title">Danışmanlık / Hizmet</div>
                        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 12px;">1 saatlik birebir teknik danışmanlık oturumu.</p>
                        <div class="product-price">₺750.00</div>
                    </div>
                    <button class="buy-btn snipcart-add-item"
                        data-item-id="urun-2"
                        data-item-price="750.00"
                        data-item-url="/shop.html"
                        data-item-description="1 saatlik birebir teknik danışmanlık oturumu."
                        data-item-name="Danışmanlık / Hizmet">
                        Sepete Ekle
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script async src="https://cdn.snipcart.com/themes/v3.4.1/default/snipcart.js"></script>
    <div hidden id="snipcart" data-api-key="BURAYA_SNIPCART_API_KEY_GELECEK"></div>
</body>
</html>
